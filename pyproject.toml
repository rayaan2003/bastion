[project]
name = "bastionguard"
version = "0.1.0"
description = "Runtime policy enforcement for AI agent tool calls — block, approve, or log unsafe actions before they execute."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rayaan Sheikh", email = "rayaansheikh442@gmail.com" }]
keywords = [
    "ai-safety",
    "ai-agents",
    "llm",
    "guardrails",
    "langgraph",
    "security",
    "compliance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/rayaan2003/bastion"
Repository = "https://github.com/rayaan2003/bastion"
Issues = "https://github.com/rayaan2003/bastion/issues"
Changelog = "https://github.com/rayaan2003/bastion/blob/master/CHANGELOG.md"

[project.optional-dependencies]
claude-agent-sdk = ["claude-agent-sdk>=0.1"]
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
openai-agents = ["openai-agents>=0.1"]
slack = ["slack_sdk>=3.27"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bastion = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "slack_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agents.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
